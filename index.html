<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17362f">
    <meta name="description" content="A focused Trinity Grade 7 Piano scales practice companion.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Trinity Grade 7 Scales</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png" sizes="192x192">
  </head>
  <body>
    <main class="app-shell" aria-label="Trinity Grade 7 Scales practice app">
      <header class="app-header">
        <p class="eyebrow">Trinity Piano</p>
        <div class="header-row">
          <h1>Grade 7 Scales</h1>
          <button class="icon-button" id="settings-button" type="button" aria-label="Open settings">⚙</button>
        </div>
        <nav class="view-tabs" aria-label="Main navigation">
          <button id="practice-tab" type="button" role="tab" aria-selected="true">Practice</button>
          <button id="analytics-tab" type="button" role="tab" aria-selected="false">Analytics</button>
        </nav>
      </header>

      <p id="app-status" class="app-status" role="status" aria-live="polite"></p>

      <section id="practice-view" class="practice-view" role="tabpanel" aria-labelledby="practice-tab">
        <div class="practice-card">
          <p id="card-category" class="card-category"></p>
          <h2 id="card-name" class="card-name">Loading your first request…</h2>
          <p id="card-conditions" class="card-conditions"></p>
          <p id="card-details" class="card-details"></p>
        </div>

        <section class="score-section" aria-labelledby="score-heading">
          <p id="score-heading" class="score-heading">How did you play it?</p>
          <div class="score-grid" id="score-grid">
            <button type="button" data-score="1" aria-label="Score 1 out of 10">1</button>
            <button type="button" data-score="2" aria-label="Score 2 out of 10">2</button>
            <button type="button" data-score="3" aria-label="Score 3 out of 10">3</button>
            <button type="button" data-score="4" aria-label="Score 4 out of 10">4</button>
            <button type="button" data-score="5" aria-label="Score 5 out of 10">5</button>
            <button type="button" data-score="6" aria-label="Score 6 out of 10">6</button>
            <button type="button" data-score="7" aria-label="Score 7 out of 10">7</button>
            <button type="button" data-score="8" aria-label="Score 8 out of 10">8</button>
            <button type="button" data-score="9" aria-label="Score 9 out of 10">9</button>
            <button type="button" data-score="10" aria-label="Score 10 out of 10">10</button>
          </div>
        </section>
      </section>

      <section id="analytics-view" class="analytics-view" role="tabpanel" aria-labelledby="analytics-tab" hidden>
        <div id="analytics-content"></div>
      </section>
    </main>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-panel">
        <div class="dialog-heading">
          <h2 id="settings-title">Settings</h2>
          <button type="submit" class="icon-button" aria-label="Close settings">×</button>
        </div>
        <label class="toggle-row" for="speech-enabled">
          <span>
            <strong>Speak requests</strong>
            <small>Uses a local device voice when one is available.</small>
          </span>
          <input id="speech-enabled" type="checkbox" checked>
        </label>
        <div class="settings-danger">
          <strong>Reset practice history</strong>
          <p>This permanently clears scores, review history, and the first-pass queue from this device.</p>
          <button id="reset-button" class="secondary-button" type="button">Reset history</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
